
name: Day 7 - Branch and Path Filters

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'

  workflow_dispatch:

jobs:
  filter-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Display welcome message
        run: |
          echo "Welcome to Day 7!"

      - name: Display branch
        run: |
          echo "Branch: ${{ github.ref_name }}"

      - name: Display filter information
        run: |
          echo "Branch and path filters are working!"
