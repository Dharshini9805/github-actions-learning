
name: My First Workflow

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Welcome message
        run: echo "Hello from GitHub Actions!"

      - name: Display current date
        run: date

      - name: Display current directory
        run: pwd

      - name: List files
        run: ls -la
