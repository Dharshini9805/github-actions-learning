
name: YAML Practice Workflow

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  yaml-practice:
    runs-on: ubuntu-latest

    steps:
      - name: Print welcome message
        run: echo "Welcome to Day 2!"

      - name: Display learning topics
        run: |
          echo "YAML Basics"
          echo "Key-value pairs"
          echo "Lists"
          echo "Nested structures"

      - name: Display completion message
        run: echo "YAML practice completed successfully"